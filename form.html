<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>

    <meta name="description" content="Collect product reviews for feedback from the end user.">
    <meta name="author" content="Munguci Gerald">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="../scripts/getdates.js" defer></script>
</head>

<body>
    <!-- HEADER -->
    <header>
        <h1>Product Review</h1>
    </header>
    <!-- CONTENT -->

    <form action="review.html" method="get" class="prform">
        <!-- Product Name -->
        <label for="product">Product Name<span class="asterisk">*</span>
        </label>
        <select name="product" required id="product">
            <option value="" disabled selected>Select a Product</option>
        </select>
        <!-- Overall Rating -->
        <fieldset>
            <legend class="label">Overall Rating<span class="asterisk">*</span></legend>
            <div class="stars">
                <label for="1star">&star;<span class="sr-only">1 star</span><input type="radio" name="rating"
                        value="1star" id="1star" required></label>
                <label for="2stars">&star; &star;<span class="sr-only">2 stars</span><input type="radio" name="rating"
                        value="2stars" id="2stars" required></label>
                <label for="3stars">&star; &star; &star;<span class="sr-only">3 stars</span><input type="radio"
                        name="rating" value="3stars" id="3stars" required></label>
                <label for="4stars">&star; &star; &star; &star;<span class="sr-only">4 stars</span><input type="radio"
                        name="rating" value="4stars" id="4stars" required></label>
                <label for="5stars">&star; &star; &star; &star; &star;<span class="sr-only">5 stars</span><input
                        type="radio" name="rating" value="5stars" id="5stars" required></label>
            </div>
        </fieldset>

        <label for="date">Date of Installation<span class="asterisk">*</span> </label>
        <input type="date" name="date" id="date" required>
        <fieldset>
            <legend class="label">Which features did you find useful in the product? (Check all that apply)</legend>
            <label for="durability"><input type="checkbox" id="durability" name="durability"
                    value="yes">Durability</label>
            <label for="ease"><input type="checkbox" id="ease" name="ease" value="yes">Ease of Use</label>
            <label for="perfomance"><input type="checkbox" id="performance" name="performance"
                    value="yes">Performance</label>
            <label for="design"><input type="checkbox" id="design" name="design" value="yes">Design</label>

            <label for="writtenReview">Written Review<span class="opt">(Optional)</span><textarea name="writtenReview"
                    id="writtenReview" rows="5" placeholder="What do you think about this product?"></textarea></label>

            <label for="userName">Your Name<span class="opt">(Optional)</span><input type="text" id="userName"
                    name="userName" placeholder="Enter your name"></label>
        </fieldset>

        <input type="submit" value="Post Review">
    </form>
    <footer>
        <p>&copy; <span id="currentyear"></span> 🪴 Munguci Gerald 🪴 Uganda</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
