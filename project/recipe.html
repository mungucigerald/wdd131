  <script>
    (function preloadRecipeImage() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var allRecipes = typeof RECIPES !== "undefined" ? RECIPES : null;
      var recipe = allRecipes && allRecipes.find(function (r) { return r.id === id; });
      if (!recipe) return;

      var parsed;
      try {
        parsed = new URL(recipe.image, window.location.href);
      } catch (error) {
        return;
      }
      if (parsed.origin === window.location.origin) return;

      var sourceURL = parsed.href.replace(/^https:?\/\//, "");
      var proxy = new URL("https://images.weserv.nl/");
      proxy.searchParams.set("url", sourceURL);
      proxy.searchParams.set("w", "800");
      proxy.searchParams.set("h", "600");
      proxy.searchParams.set("fit", "cover");
      proxy.searchParams.set("q", "80");

      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.href = proxy.toString();
      document.head.appendChild(link);
    })();
  </script>
  <script src="scripts/main.js" defer></script>
  <script src="scripts/recipe-detail.js" defer></script>
